[project]
name = "task05-chatbot-with-memory-tool-use"
version = "1.0.0"
description = "Nexoramind Task 05 - Intelligent Chatbot with Memory and Tool Use (Calculator, Weather, Dictionary, Wikipedia) with FastAPI and Streamlit"
authors = [
    { name = "Krishna Gupta" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "streamlit>=1.32.0",
    "sympy>=1.12",
    "wikipedia>=1.4.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pandas>=2.2.0"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
